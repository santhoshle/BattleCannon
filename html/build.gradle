buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  dependencies {
    classpath "org.docstr.gwt:org.docstr.gwt.gradle.plugin:$gwtPluginVersion"
  }
}
apply plugin: 'org.docstr.gwt'
apply plugin: 'war'

// Where the deployable web build ends up, relative to html/.
var outputPath = 'build/dist/'

gwt {
  gwtVersion = "$gwtFrameworkVersion" // Must match the GWT version the libGDX GWT backend was built with.
  maxHeapSize = '1G'
  minHeapSize = '1G'
  sourceLevel = '1.11'

  modules = ['com.solaraslight.GdxDefinition']

  war = file(outputPath)
  compiler.optimize = 9
  compiler.strict = true

  devMode {
    port = 8080
    startupUrl = 'http://127.0.0.1:8080/index.html'
    modules = ['com.solaraslight.GdxDefinitionSuperdev']
  }
  superDev {
    modules = ['com.solaraslight.GdxDefinitionSuperdev']
  }
}

gwt.extraSourceDirs.from(
  file('src/main/java'),
  files(project(':core').sourceSets.main.allJava.srcDirs),
  files(sourceSets.main.output.resourcesDir)
)

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
  implementation "com.google.jsinterop:jsinterop-annotations:2.1.0:sources"
  constraints {
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
  }
}

// The GWT compile also writes the preloader assets into build/dist/assets, which Gradle doesn't know about, so a build
// restored from the cache would be missing them. Always compile for real.
tasks.named('gwtCompile') {
  outputs.cacheIf { false }
}

// The temporary war/ folder causes problems if stale files remain in it.
clean.delete += [file('war')]

// GWT builds start from compileJava, so the output must be cleaned before anything is written to it.
tasks.named('compileJava').get().dependsOn('clean')
tasks.compileJava.dependsOn('processResources')

// Builds the deployable web version into html/build/dist. Serve that folder with any HTTP server.
tasks.register('dist') {
  dependsOn(['build'])
  doLast {
    file(outputPath).mkdirs()
    copy {
      from('build/gwt/out') {
        exclude '**/*.symbolMap'
      }
      into outputPath
    }
    copy {
      from('webapp') {
        exclude 'index.html'
        exclude 'refresh.png'
      }
      into outputPath
    }
    copy {
      from('webapp') {
        include 'index.html'
        // Removes the SuperDev refresh button from the deployed page only.
        filter { String line -> line.replaceAll('<a class="superdev" .+', '') }
      }
      into outputPath
    }
    copy {
      from 'war'
      into outputPath
    }
  }
}

tasks.register('distZip', Zip) {
  dependsOn('dist')
  from(outputPath)
  archiveVersion = projectVersion
  archiveBaseName.set('CanyonSalvo-web')
  destinationDirectory.set(file('build'))
}

// Recompiles in the browser on refresh while you edit sources. Use only during development.
tasks.register('superDev') {
  dependsOn('dist', 'gwtDevMode')
  group('gwt')
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
eclipse.project.name = appName + '-html'
