buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    google()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:$androidPluginVersion"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // Lets IntelliJ IDEA "Build and run using IntelliJ IDEA" find the compiled classes.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  // GWT 2.11 compiles Java 11 sources at most, so core and html stay on 11.
  java.sourceCompatibility = 11
  java.targetCompatibility = 11
  compileJava {
    options.encoding = 'UTF-8'
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Canyon Salvo'
  repositories {
    mavenCentral()
    google()
  }
}

eclipse.project.name = 'CanyonSalvo-parent'
